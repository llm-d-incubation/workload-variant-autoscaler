# BACKEND OVERLAY — llm-d-inference-sim (fake HTTP server, no GPU)
# Apply with: --cluster-config benchmark/config/cluster-configs/inference-sim.yaml
#
# Lowest-priority backend. Serves any model name without weights; the sim binary
# handles its own argv (vllm.modelCommand: imageDefault). Recent sim releases
# emit vllm:-prefixed Prometheus metrics, so the scenario's native-metric KEDA
# strategy applies unchanged.
#
# Merge note: dicts deep-merge, lists replace wholesale. This overlay only sets
# backend concerns; it never sets `keda` (scaleTargetRef.kind is a per-scenario
# topology concern).

# CPU-only nodes, no GPU
affinity:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux

accelerator:
  count: 0
  memory: 24

model:
  gpuMemoryUtilization: 0

images:
  vllm:
    repository: ghcr.io/llm-d/llm-d-inference-sim
    tag: latest

decode:
  accelerator:
    count: 0
  resources:
    limits:
      memory: 256Mi
      cpu: "500m"
    requests:
      memory: 256Mi
      cpu: "100m"
  vllm:
    modelCommand: imageDefault
    additionalFlags:
    - "--prefill-time-per-token=200ms"
    - "--prefill-time-std-dev=3ms"
    - "--enable-kvcache=true"
    - "--max-model-len=8192"
    - "--kv-cache-size=16384"
    - "--force-dummy-tokenizer=true"

prefill:
  accelerator:
    count: 0
  resources:
    limits:
      memory: 256Mi
      cpu: "500m"
    requests:
      memory: 256Mi
      cpu: "100m"
  vllm:
    modelCommand: imageDefault
    additionalFlags:
    - "--prefill-time-per-token=200ms"
    - "--prefill-time-std-dev=3ms"
    - "--enable-kvcache=true"
    - "--max-model-len=8192"
    - "--kv-cache-size=16384"
    - "--force-dummy-tokenizer=true"
