scenario:
  - name: wide-ep-lws-scale-mechanics

    model:
      name: test-model
      shortName: test-model
      path: models/test-model
      huggingfaceId: test-model
      size: 1Gi
      maxModelLen: 512
      blockSize: 8
      gpuMemoryUtilization: 0

    accelerator:
      count: 0
      memory: 24

    affinity:
      enabled: true
      nodeSelector:
        kubernetes.io/os: linux

    images:
      vllm:
        repository: ghcr.io/llm-d/llm-d-inference-sim
        tag: v0.9.0
        pullPolicy: IfNotPresent

    multinode:
      enabled: true

    modelArtifacts:
      extraLabels:
        llm-d.ai/accelerator-variant: cpu
        llm-d.ai/variant: "${model.idLabel}-decode"

    modelservice:
      enabled: true
      uriProtocol: hf

      gateway:
        className: none

      routing:
        proxy:
          enabled: false

    decode:
      enabled: true
      replicas: 1

      accelerator:
        count: 0

      parallelism:
        tensor: 0
        data: 1
        dataLocal: 1
        workers: 2

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

      extraContainerConfig:
        ports:
          - name: metrics
            containerPort: 8000
            protocol: TCP

      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s
          labels:
            release: kube-prometheus-stack
          relabelings:
            - sourceLabels:
                - __meta_kubernetes_pod_label_llm_d_ai_variant
              targetLabel: llm_d_ai_variant
              action: replace

      vllm:
        modelCommand: imageDefault
        additionalFlags:
          - --time-to-first-token=2000ms
          - --inter-token-latency=100ms
          - --mode=random
          - --enable-kvcache
          - --kv-cache-size=1
          - --block-size=8
          - --max-num-seqs
          - "5"
          - --max-model-len
          - "512"
          - --fake-metrics
          - '{"kv-cache-usage":0.3,"running-requests":1,"waiting-requests":0}'

    prefill:
      enabled: false
      replicas: 0

    standalone:
      enabled: false

    extraObjects:
      # Namespace-local V2 calibration copied from WVA's current saturation
      # smoke path. It deterministically requests desired replicas = 2 from one
      # Ready group without changing the cluster-global saturation policy.
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: wva-saturation-scaling-config
          namespace: "${namespace.name}"
          labels:
            app.kubernetes.io/name: workload-variant-autoscaler
        data:
          default: |
            analyzers:
              - name: saturation
                score: 1.0
            scaleUpThreshold: 0.30
            scaleDownBoundary: 0.20
            kvCacheThreshold: 0.80
            queueLengthThreshold: 50
            kvSpareTrigger: 0.10
            queueSpareTrigger: 5
            enableLimiter: false

      # Target/scaler structure is intentionally derived from WVA PR #1517.
      # It starts paused so manual LWS 1 -> 2 -> 1 group scaling can run first.
      - apiVersion: keda.sh/v1alpha1
        kind: ScaledObject
        metadata:
          name: "${model.idLabel}-decode"
          namespace: "${namespace.name}"
          annotations:
            autoscaling.keda.sh/paused: "true"
            llm-d.ai/managed: "true"
            llm-d.ai/model-id: test-model
            llm-d.ai/variant-cost: "30.0"
        spec:
          scaleTargetRef:
            apiVersion: leaderworkerset.x-k8s.io/v1
            kind: LeaderWorkerSet
            name: "${model.idLabel}-decode"
          minReplicaCount: 1
          maxReplicaCount: 2
          pollingInterval: 5
          cooldownPeriod: 30
          triggers:
            - type: prometheus
              name: wva-desired-replicas
              metricType: AverageValue
              metadata:
                serverAddress: "https://kube-prometheus-stack-prometheus.workload-variant-autoscaler-monitoring.svc.cluster.local:9090"
                query: 'wva_desired_replicas{variant_name="${model.idLabel}-decode",exported_namespace="${namespace.name}"}'
                threshold: "1"
                activationThreshold: "0"
                unsafeSsl: "true"

    storage:
      modelPvc:
        size: 1Gi
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
      workloadPvc:
        size: 1Gi
        accessModes:
          - ReadWriteOnce
        storageClassName: standard

    vllmCommon:
      volumes:
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm

    control:
      waitTimeout: 900
      waitPeriod: 5
