# P/D DISAGGREGATION — KEDA experiment: queue-aggressive (BACKEND-AGNOSTIC)
# Delta from baseline.yaml (this dir): scale earlier and further on queue depth.
#   - vllm-queue-size threshold 20 -> 10 (prefill + decode)
#   - maxReplicas 4 -> 8 (prefill + decode)
# Everything else is identical to baseline so results isolate this delta.
#
# This scenario deliberately contains NO backend-specific settings (image,
# accelerator, per-role resources, vLLM command, plugins). Pick a backend by
# layering one of benchmark/config/cluster-configs/{vllm,vllm-sim-qwen3-32b,inference-sim}.yaml
# via `--cluster-config`. See benchmark/README.md.
#
# Merge note: the harness deep-merges dicts but REPLACES lists wholesale. The
# scaling strategy (keda) lives here because its scaleTargetRef.kind is a
# topology concern (Deployment); backend overlays must not set `keda`.

scenario:
  - name: "pd-disaggregation"

    # =========================================================================
    # KUSTOMIZE DEPLOY METHOD — disabled; deploying via modelservice below
    # =========================================================================
    kustomize:
      enabled: false
      guideName: "pd-disaggregation"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}
      patches: []

    # =========================================================================
    # MODEL — identity only. Backend overlays set gpuMemoryUtilization.
    # =========================================================================
    model:
      name: Qwen/Qwen3-32B      # served model id + harness request/tokenizer; must equal huggingfaceId
      shortName: qwen3-32b
      path: models/Qwen/Qwen3-32B
      huggingfaceId: Qwen/Qwen3-32B
      maxModelLen: 16384
      size: 2Gi

    # =========================================================================
    # DEPLOYMENT METHOD
    # =========================================================================
    modelservice:
      enabled: true

      uriProtocol: hf # no model-weight download; backends serve without weights

      # Gateway topology — epponly (no Kubernetes Gateway/HTTPRoute)
      gateway:
        className: epponly

      # Routing connector — nixlv2 selects the routing-sidecar wire protocol
      routing:
        connector: nixlv2

      # EPP router — PD plugin chain. EPP-side and independent of the backend.
      router:
        epp:
          replicas: 1
          pluginsConfigFile: "pd-config.yaml"
          pluginsCustomConfig:
            pd-config.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: disagg-headers-handler
              - type: always-disagg-pd-decider
              - type: disagg-profile-handler
                parameters:
                  deciderPluginName: always-disagg-pd-decider
              - type: prefill-filter
              - type: decode-filter
              - type: prefix-cache-scorer
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
              - type: active-request-scorer
              schedulingProfiles:
              - name: prefill
                plugins:
                - pluginRef: prefill-filter
                - pluginRef: prefix-cache-scorer
                  weight: 3
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
              - name: decode
                plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        proxy:
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
        monitoring:
          prometheus:
            enabled: true

      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

    # =========================================================================
    # DECODE — backend-agnostic skeleton. Backend overlays add resources,
    # accelerator, vllm command, initContainers, env and volumes.
    # =========================================================================
    decode:
      replicas: 1
      accelerator:
        count: 1                 # per-role accelerator count; backend overlays override (0 for CPU sims)
      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1
      extraContainerConfig:
        ports:
          - containerPort: 8200 # metrics; matches modelservice decode metricsPort
            name: metrics
            protocol: TCP
      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s

    # =========================================================================
    # PREFILL — backend-agnostic skeleton (see DECODE).
    # =========================================================================
    prefill:
      enabled: true
      replicas: 1
      accelerator:
        count: 1                 # per-role accelerator count; backend overlays override (0 for CPU sims)
      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1
      extraContainerConfig:
        ports:
          - containerPort: 8000 # metrics; matches modelservice prefill metricsPort
            name: metrics
            protocol: TCP
      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s

    standalone:
      enabled: false

    # =========================================================================
    # SCALING STRATEGY (KEDA) — recommended per-role autoscaling on native vLLM
    # metrics, exposed by the real-vLLM, vLLM-CPU-sim and recent inference-sim
    # backends alike. scaleTargetRef.kind is Deployment for this topology.
    # =========================================================================
    keda:
      enabled: true
      namespace: ""              # defaults to deploy namespace (first slot of `-p`)
      prometheus:
        baseUrl: http://prometheus-operated.monitoring.svc.cluster.local
        port: 9090
      scaledObjects:
      - name: pd-disaggregation-prefill
        scaleTargetRef:
          kind: Deployment
          name: ${model.idLabel}-prefill
        minReplicas: 1
        maxReplicas: 8
        unsafeSsl: true
        triggers:
          - name: vllm-queue-size
            type: prometheus
            query: 'max(vllm:num_requests_waiting{model_name="${model.name}",role="prefill"})'
            threshold: "10"
            metricType: AverageValue
            activationThreshold: "0"
          - name: vllm-kv-utilization
            type: prometheus
            query: 'max(vllm:kv_cache_usage_perc{model_name="${model.name}",role="prefill"})'
            threshold: "0.95"
            metricType: AverageValue
            activationThreshold: "0"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300
      - name: pd-disaggregation-decode
        scaleTargetRef:
          kind: Deployment
          name: ${model.idLabel}-decode
        minReplicas: 1
        maxReplicas: 8
        unsafeSsl: true
        triggers:
          - name: vllm-queue-size
            type: prometheus
            query: 'max(vllm:num_requests_waiting{model_name="${model.name}",role="decode"})'
            threshold: "10"
            metricType: AverageValue
            activationThreshold: "0"
          - name: vllm-kv-utilization
            type: prometheus
            query: 'max(vllm:kv_cache_usage_perc{model_name="${model.name}",role="decode"})'
            threshold: "0.95"
            metricType: AverageValue
            activationThreshold: "0"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300

    # =========================================================================
    # COMMON — shared-memory volume only. Backends that need extra volumes
    # (plugins, model config) add them under decode/prefill in their overlay.
    # =========================================================================
    vllmCommon:
      shmMemory: 500Mi
      volumes:
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm

    storage:
      workloadPvc:
        accessModes:
          - ReadWriteMany
        storageClassName: auto
      modelPvc:
        size: 2Gi
        accessModes:
          - ReadWriteMany
        storageClassName: auto

    timeouts:
      controlWait: 300
      harnessWait: 900000

    workDir: "~/data/pd-disaggregation"

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      pvcSize: 3Gi
      resources:
        cpu: "1"
        memory: 2Gi
