# LWS P/D DISAGGREGATION SIM SCENARIO
# Mirrors wide-ep-lws-nvidia-gpu-vllm-glm-5-2-v2-{prefill,decode-ll} topology using
# llm-d-inference-sim instead of real vLLM. No GPUs required.
#
# Key differences from pd-disaggregation-sim.yaml:
#   - multinode.enabled: true — deploys LeaderWorkerSet (LWS) instead of Deployments
#   - parallelism.workers: 2 — LWS group size: 1 leader + 1 worker
#   - KEDA scaleTargetRef.kind: LeaderWorkerSet (not Deployment)
#   - Model is facebook-opt-125m
#
# Sim-specific (same as pd-disaggregation-sim.yaml):
#   - Sim image (ghcr.io/llm-d/llm-d-inference-sim) replaces vllm/vllm-openai
#   - vllm.modelCommand: imageDefault — sim binary handles its own argv
#   - No initContainers, no NCCL/UCX env vars
#   - Accelerator count 0, minimal CPU/memory resources
#   - EPP router config (pd-config.yaml plugin chain) identical to upstream

scenario:
  - name: "lws-pd-disaggregation-sim"

    # =========================================================================
    # KUSTOMIZE DEPLOY METHOD — disabled; deploying via modelservice below
    # =========================================================================
    kustomize:
      enabled: false
      guideName: "pd-disaggregation"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}
      patches: []

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================

    # -------------------------------------------------------------------------
    # Model Configuration
    # -------------------------------------------------------------------------
    model:
      name: facebook/opt-125m
      shortName: facebook-opt-125m
      path: models/facebook/opt-125m
      huggingfaceId: facebook/opt-125m
      gpuMemoryUtilization: 0
      maxModelLen: 16384
      size: 2Gi

    # -------------------------------------------------------------------------
    # Affinity / Node Selection — CPU-only nodes, no GPU required
    # -------------------------------------------------------------------------
    affinity:
      enabled: true
      nodeSelector:
        kubernetes.io/os: linux

    # -------------------------------------------------------------------------
    # Accelerator — none; memory value exists only to pass capacity-planner check
    # -------------------------------------------------------------------------
    accelerator:
      count: 0
      memory: 24

    # -------------------------------------------------------------------------
    # Sim image overrides for both prefill and decode pods
    # -------------------------------------------------------------------------
    images:
      vllm:
        repository: ghcr.io/llm-d/llm-d-inference-sim
        tag: latest

    # =========================================================================
    # MULTINODE (LWS)
    # =========================================================================
    multinode:
      enabled: true

    # =========================================================================
    # DEPLOYMENT METHOD
    # =========================================================================
    modelservice:
      enabled: true

      uriProtocol: hf # disable download of model weights; sim serves any model name

      # -----------------------------------------------------------------------
      # Gateway topology — epponly (no Kubernetes Gateway/HTTPRoute)
      # -----------------------------------------------------------------------
      gateway:
        className: epponly

      # -----------------------------------------------------------------------
      # Routing connector
      # -----------------------------------------------------------------------
      routing:
        connector: nixlv2

      # -----------------------------------------------------------------------
      # EPP router — PD plugin chain
      # -----------------------------------------------------------------------
      router:
        epp:
          replicas: 1
          pluginsConfigFile: "pd-config.yaml"
          pluginsCustomConfig:
            pd-config.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: disagg-headers-handler
              - type: always-disagg-pd-decider
              - type: disagg-profile-handler
                parameters:
                  deciderPluginName: always-disagg-pd-decider
              - type: prefill-filter
              - type: decode-filter
              - type: prefix-cache-scorer
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
              - type: active-request-scorer
              schedulingProfiles:
              - name: prefill
                plugins:
                - pluginRef: prefill-filter
                - pluginRef: prefix-cache-scorer
                  weight: 3
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
              - name: decode
                plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        proxy:
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
        monitoring:
          prometheus:
            enabled: true

      # -----------------------------------------------------------------------
      # HTTPRoute timeout
      # -----------------------------------------------------------------------
      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

    # =========================================================================
    # DECODE
    # =========================================================================
    decode:
      replicas: 1

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 2

      resources:
        limits:
          memory: 256Mi
          cpu: "500m"
        requests:
          memory: 256Mi
          cpu: "100m"

      accelerator:
        count: 0

      extraContainerConfig:
        ports:
          - containerPort: 8200
            name: metrics
            protocol: TCP

      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s
          relabelings:
          - targetLabel: role
            replacement: decode
            action: replace

      vllm:
        modelCommand: imageDefault
        additionalFlags:
        - "--prefill-time-per-token=1ms"
        - "--prefill-time-std-dev=3ms"
        - "--enable-kvcache=true"
        - "--max-model-len=8192"
        - "--kv-cache-size=163840"
        - "--force-dummy-tokenizer=true"
        - "-v=4"

    # =========================================================================
    # PREFILL
    # =========================================================================
    prefill:
      enabled: true
      replicas: 1

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 2

      extraContainerConfig:
        ports:
          - containerPort: 8000
            name: metrics
            protocol: TCP

      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s
          relabelings:
          - targetLabel: role
            replacement: prefill
            action: replace

      resources:
        limits:
          memory: 256Mi
          cpu: "500m"
        requests:
          memory: 256Mi
          cpu: "100m"

      accelerator:
        count: 0

      vllm:
        modelCommand: imageDefault
        additionalFlags:
        - "--prefill-time-per-token=1ms"
        - "--prefill-time-std-dev=3ms"
        - "--enable-kvcache=true"
        - "--max-model-len=8192"
        - "--kv-cache-size=163840"
        - "--force-dummy-tokenizer=true"
        - "-v=4"

    standalone:
      enabled: false

    keda:
      enabled: true
      namespace: ""   # defaults to deploy namespace
      prometheus:
        baseUrl: http://prometheus-operated.monitoring.svc.cluster.local
        port: 9090
      scaledObjects:
      - name: lws-pd-disaggregation-sim-decode
        scaleTargetRef:
          apiVersion: leaderworkerset.x-k8s.io/v1
          kind: LeaderWorkerSet
          name: ${model.idLabel}-decode
        minReplicas: 1
        maxReplicas: 4
        unsafeSsl: true
        triggers:
          - name: vllm-queue-size
            type: prometheus
            query: 'max(vllm:num_requests_waiting{model_name="${model.name}", role="decode"})'
            threshold: "20"
            metricType: AverageValue
          - name: vllm-kv-utilization
            type: prometheus
            query: 'max(vllm:kv_cache_usage_perc{model_name="${model.name}", role="decode"})'
            threshold: "0.95"
            metricType: AverageValue
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 10
            policies:
              - type: Pods
                value: 1
                periodSeconds: 20
          scaleDown:
            stabilizationWindowSeconds: 10
            policies:
              - type: Pods
                value: 1
                periodSeconds: 20
      - name: lws-pd-disaggregation-sim-prefill
        scaleTargetRef:
          apiVersion: leaderworkerset.x-k8s.io/v1
          kind: LeaderWorkerSet
          name: ${model.idLabel}-prefill
        minReplicas: 1
        maxReplicas: 4
        unsafeSsl: true
        triggers:
          - name: vllm-queue-size
            type: prometheus
            query: 'max(vllm:num_requests_waiting{model_name="${model.name}", role="prefill"})'
            threshold: "20"
            metricType: AverageValue
          - name: vllm-kv-utilization
            type: prometheus
            query: 'max(vllm:kv_cache_usage_perc{model_name="${model.name}", role="prefill"})'
            threshold: "0.95"
            metricType: AverageValue
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 10
            policies:
              - type: Pods
                value: 1
                periodSeconds: 20
          scaleDown:
            stabilizationWindowSeconds: 10
            policies:
              - type: Pods
                value: 1
                periodSeconds: 20


    vllmCommon:
      shmMemory: 500Mi
      volumes:
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm

    storage:
      workloadPvc:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
      modelPvc:
        size: 2Gi
        accessModes:
          - ReadWriteOnce
        storageClassName: standard

    timeouts:
      controlWait: 300
      harnessWait: 900000

    workDir: "~/data/lws-pd-disaggregation-sim"

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      pvcSize: 3Gi
      resources:
        cpu: "1"
        memory: 2Gi
