# P/D DISAGGREGATION SIM SCENARIO
# Mirrors https://github.com/llm-d/llm-d-benchmark/blob/main/config/scenarios/guides/pd-disaggregation.yaml
# but uses llm-d-inference-sim instead of real vLLM. No GPUs required.
#
# Key sim differences from the upstream GPU scenario:
#   - Sim image (ghcr.io/llm-d/llm-d-inference-sim) replaces vllm/vllm-openai
#   - Prefill uses `vllm.customCommand: imageDefault` — sim binary handles its
#     own argv; the modelservice chart passes --port, --model, etc. directly
#   - Decode likewise uses `imageDefault`; KV transfer is simulated via
#     --kv-cache-transfer-latency (set by the sim's latency profile), not NixlConnector
#   - No initContainers (set_llmdbench_environment.py / llmdbench_env.sh are
#     vLLM-specific; the sim does not need them)
#   - No NCCL/UCX/NVSHMEM env vars, no IPC_LOCK/SYS_RAWIO capabilities
#   - No vllmCommon.kvTransfer / vllmCommon.flags — those expand to vllm CLI args
#   - Accelerator count 0, minimal CPU/memory resources
#   - EPP router config (pd-config.yaml plugin chain) is identical to upstream:
#     it is EPP-side and independent of the inference backend

scenario:
  - name: "pd-disaggregation-sim"

    # =========================================================================
    # KUSTOMIZE DEPLOY METHOD — disabled; deploying via modelservice below
    # =========================================================================
    kustomize:
      enabled: false

      guideName: "pd-disaggregation"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}
      patches: []

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================

    # -------------------------------------------------------------------------
    # Model Configuration
    # No GPU required; the sim serves any model name without downloading weights.
    # -------------------------------------------------------------------------
    model:
      name: facebook/opt-125m
      shortName: facebook-opt-125m
      path: models/facebook/opt-125m
      huggingfaceId: facebook/opt-125m
      gpuMemoryUtilization: 0
      maxModelLen: 16384
      size: 2Gi

    # -------------------------------------------------------------------------
    # Affinity / Node Selection — CPU-only nodes, no GPU required
    # -------------------------------------------------------------------------
    affinity:
      enabled: true
      nodeSelector:
        kubernetes.io/os: linux

    # -------------------------------------------------------------------------
    # Accelerator — none; memory value exists only to pass capacity-planner check
    # -------------------------------------------------------------------------
    accelerator:
      count: 0
      memory: 24

    # -------------------------------------------------------------------------
    # Sim image overrides for both prefill and decode pods
    # -------------------------------------------------------------------------
    images:
      vllm:
        repository: ghcr.io/llm-d/llm-d-inference-sim
        tag: latest

    # =========================================================================
    # DEPLOYMENT METHOD
    # =========================================================================
    modelservice:
      enabled: true

      # -----------------------------------------------------------------------
      # Gateway topology — epponly (no Kubernetes Gateway/HTTPRoute)
      # -----------------------------------------------------------------------
      gateway:
        className: epponly

      # -----------------------------------------------------------------------
      # Routing connector — nixlv2 tells the routing-sidecar which wire protocol
      # to use when forwarding the prefill phase to the prefill pod.
      # -----------------------------------------------------------------------
      routing:
        connector: nixlv2

      # -----------------------------------------------------------------------
      # EPP router — PD plugin chain, identical to the upstream GPU scenario.
      # The plugin config is EPP-side and independent of the inference backend.
      # -----------------------------------------------------------------------
      router:
        epp:
          replicas: 1
          pluginsConfigFile: "pd-config.yaml"
          pluginsCustomConfig:
            pd-config.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: disagg-headers-handler
              - type: always-disagg-pd-decider
              - type: disagg-profile-handler
                parameters:
                  deciderPluginName: always-disagg-pd-decider
              - type: prefill-filter
              - type: decode-filter
              - type: prefix-cache-scorer
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
              - type: active-request-scorer
              schedulingProfiles:
              - name: prefill
                plugins:
                - pluginRef: prefill-filter
                - pluginRef: prefix-cache-scorer
                  weight: 3
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
              - name: decode
                plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        proxy:
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
        monitoring:
          prometheus:
            enabled: true

      # -----------------------------------------------------------------------
      # HTTPRoute timeout — mirror upstream
      # -----------------------------------------------------------------------
      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

      # =========================================================================
      # DECODE
      # The routing-sidecar (injected by the modelservice chart) receives requests
      # and forwards the prefill phase to the prefill pod.  The sim handles decode
      # locally.  KV "transfer" latency is simulated via --kv-cache-transfer-latency
      # so TTFT includes the cross-pod round-trip cost without actual tensor movement.
      # =========================================================================
      decode:
        replicas: 1

        parallelism:
          tensor: 1
          data: 1
          dataLocal: 1
          workers: 1

        resources:
          limits:
            memory: 256Mi
            cpu: "500m"
          requests:
            memory: 256Mi
            cpu: "100m"

        accelerator:
          count: 0

        extraContainerConfig:
          ports:
            - containerPort: 8200 # TODO: use ${modelservice.decode.metricsPort} instead of hardcoded value
              name: metrics
              protocol: TCP

        monitoring:
          podmonitor:
            enabled: true
            portName: metrics
            path: /metrics
            interval: 15s

        vllm:
          modelCommand: imageDefault
          additionalFlags:
          - "--prefill-time-per-token=200ms"
          - "--prefill-time-std-dev=3ms"
          - "--enable-kvcache=true"
          - "--max-model-len=8192"
          - "--kv-cache-size=163840"

      # =========================================================================
      # PREFILL
      # The sim binary handles its own argv when modelCommand: imageDefault.
      # Latency profile: ~200 ms per input token to simulate a real prefill phase.
      # No initContainers, no GPU env vars.
      # =========================================================================
      prefill:
        enabled: true
        replicas: 1

        parallelism:
          tensor: 1
          data: 1
          dataLocal: 1
          workers: 1

        extraContainerConfig:
        ports:
          - containerPort: 8200 # TODO: use ${modelservice.prefill.metricsPort} instead of hardcoded value
            name: metrics
            protocol: TCP

        monitoring:
          podmonitor:
            enabled: true
            portName: metrics
            path: /metrics
            interval: 15s

        resources:
          limits:
            memory: 256Mi
            cpu: "500m"
          requests:
            memory: 256Mi
            cpu: "100m"

        accelerator:
          count: 0

        vllm:
          modelCommand: imageDefault
          additionalFlags:
          - "--prefill-time-per-token=200ms"
          - "--prefill-time-std-dev=3ms"
          - "--enable-kvcache=true"
          - "--max-model-len=8192"
          - "--kv-cache-size=163840"

    standalone:
      enabled: false

    keda:
      enabled: true

      namespace: ""              # defaults to deploy namespace (first slot of `-p`)

      prometheus:
        baseUrl: http://prometheus-operated.monitoring.svc.cluster.local
        port: 9090

      scaledObjects:
      - name: pd-disaggregation-sim-prefill
        scaleTargetRef:
          kind: Deployment
          name: ${model.idLabel}-prefill
        minReplicas: 1
        maxReplicas: 4
        unsafeSsl: true
        triggers:
          - name: epp-queue-size
            type: prometheus
            query: 'max(llm_d_epp_average_queue_size{name="${model.idLabel}-router"})'
            threshold: "0.7"
            metricType: AverageValue
            activationThreshold: "0"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300
      - name: pd-disaggregation-sim-decode
        scaleTargetRef:
          kind: Deployment
          name: ${model.idLabel}-decode
        minReplicas: 1
        maxReplicas: 4
        unsafeSsl: true
        triggers:
          - name: epp-queue-size
            type: prometheus
            query: 'max(llm_d_epp_average_queue_size{name="${model.idLabel}-router"})'
            threshold: "0.7"
            metricType: AverageValue
            activationThreshold: "0"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300

    # =========================================================================
    # COMMON — vLLM Common
    # Minimal: no kvTransfer (sim doesn't use NixlConnector), no vllm flags.
    # The shared-config volume is not needed (no set_llmdbench_environment.py).
    # =========================================================================
    vllmCommon:
      shmMemory: 500Mi
      volumes:
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm


    # =========================================================================
    # STORAGE
    # =========================================================================
    storage:
      workloadPvc:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
      modelPvc:
        size: 2Gi
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
      uriProtocol: hf

    # =========================================================================
    # TIMEOUTS — mirror upstream values
    # =========================================================================
    timeouts:
      controlWait: 300
      harnessWait: 900000

    # =========================================================================
    # WORKLOAD / HARNESS
    # =========================================================================
    workDir: "~/data/pd-disaggregation-sim"

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      pvcSize: 3Gi
      resources:
        cpu: "1"
        memory: 2Gi
