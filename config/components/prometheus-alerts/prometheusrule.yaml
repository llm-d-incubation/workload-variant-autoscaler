apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: controller-manager-alerts
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-variant-autoscaler
    release: kube-prometheus-stack
spec:
  groups:
  - name: wva.rules
    rules:
    - alert: WVAHighErrorRate
      expr: sum by (component, error_type) (rate(wva_errors_total[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "WVA error rate elevated in {{ $labels.component }}"
        description: "WVA component '{{ $labels.component }}' error_type '{{ $labels.error_type }}' rate is {{ $value | printf \"%.2f\" }}/sec (>6/min threshold) sustained for 5+ minutes. Check controller logs for error patterns."

    - alert: WVAOptimizationLoopStalled
      expr: max_over_time(wva_models_processed[10m]) == 0 or absent_over_time(wva_models_processed[10m])
      for: 15m
      labels:
        severity: info
      annotations:
        summary: "WVA optimization loop has stopped processing models"
        description: "No models have been processed over a 10-minute window sustained for 15+ minutes. If there are models to process, this can indicate optimization loop may be stalled or crashed, or there are issues with metric collection. Check controller pod status and logs, or verify Prometheus endpoint connectivity."

    - alert: WVAMetricsCollectionFailing
      expr: sum by (query_type, reason) (rate(wva_metrics_collection_errors_total[5m])) > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "WVA metrics collection failing for {{ $labels.query_type }}"
        description: "Metrics collection query_type '{{ $labels.query_type }}' failing with reason '{{ $labels.reason }}' at {{ $value | printf \"%.2f\" }}/sec (>30/min threshold) sustained for 5+ minutes. Scaling decisions may be based on stale data. Verify Prometheus/metrics endpoint connectivity."

    - alert: WVAGPUResourceExhausted
      expr: wva_available_gpus == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "No {{ $labels.accelerator_type }} GPUs available for WVA scaling"
        description: "No {{ $labels.accelerator_vendor }} {{ $labels.accelerator_model }} ({{ $labels.accelerator_type }}) GPUs available for WVA scaling for 5+ minutes. Consider adding GPU nodes or check if existing nodes are schedulable."

    - alert: WVAReplicaScalingThrashing
      expr: sum by (namespace, variant_name) (rate(wva_replica_scaling_total[10m])) > 0.033
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "WVA scaling thrashing detected for {{ $labels.namespace }}/{{ $labels.variant_name }}"
        description: "Variant {{ $labels.namespace }}/{{ $labels.variant_name }} scaling at {{ $value | printf \"%.3f\" }}/sec (>2/min threshold) sustained for 10+ minutes, indicating possible thrashing. Review scaling thresholds and consider adjusting stabilization window or thresholds."
