apiVersion: v1
kind: ConfigMap
metadata:
  name: wva-limiter-config
  namespace: workload-variant-autoscaler-system
data:
  # The limiter configuration is read once at controller startup. Changing it
  # requires restarting the controller.
  default: |
    limiters:
      - name: namespace-inventory
        type: namespace-inventory
        # Namespaces listed here bypass this limiter entirely (no inventory
        # constraint). Use for system/privileged namespaces or namespaces that
        # should reach all cluster nodes.
        exclude:
          - kube-system
          - workload-variant-autoscaler-system
        # Per-namespace node label selectors. Matching nodes' GPUs form that
        # namespace's inventory. Standard Kubernetes LabelSelector (matchLabels
        # and matchExpressions). The reserved key "default" applies to any
        # namespace without an explicit entry; omit it to deny unlisted
        # namespaces (zero inventory).
        selectors:
          llm-d-prod:
            matchLabels:
              team: prod
          llm-d-dev:
            matchExpressions:
              - key: team
                operator: In
                values: [dev, dev-canary]
          default:
            matchLabels:
              pool: shared
