{{- /*
hpa.yaml — deploys a plain Kubernetes HorizontalPodAutoscaler that reads the
wva_desired_replicas external metric exposed by the Prometheus Adapter.

Set hpa.enabled=false when an external platform (e.g. KServe) already owns
the HPA for the same target Deployment. Two controllers competing over the
same HPA leads to undefined, conflicting scaling behavior.

See docs/integrations/kserve-integration.md for the full migration guide.
*/ -}}
{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "workload-variant-autoscaler.fullname" . }}-hpa
  namespace: {{ .Values.llmd.namespace }}
  labels:
    {{- include "workload-variant-autoscaler.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-decode" .Values.llmd.modelName }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.hpa.behavior.scaleUp.stabilizationWindowSeconds }}
      selectPolicy: {{ .Values.hpa.behavior.scaleUp.selectPolicy }}
      policies:
      {{- range .Values.hpa.behavior.scaleUp.policies }}
      - type: {{ .type }}
        value: {{ .value }}
        periodSeconds: {{ .periodSeconds }}
      {{- end }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.hpa.behavior.scaleDown.stabilizationWindowSeconds }}
      selectPolicy: {{ .Values.hpa.behavior.scaleDown.selectPolicy }}
      policies:
      {{- range .Values.hpa.behavior.scaleDown.policies }}
      - type: {{ .type }}
        value: {{ .value }}
        periodSeconds: {{ .periodSeconds }}
      {{- end }}
  metrics:
  - type: External
    external:
      metric:
        name: wva_desired_replicas
        selector:
          matchLabels:
            variant_name: {{ include "workload-variant-autoscaler.fullname" . }}-va
            exported_namespace: {{ .Values.llmd.namespace }}
            {{- if .Values.wva.controllerInstance }}
            controller_instance: {{ .Values.wva.controllerInstance | quote }}
            {{- end }}
      target:
        type: AverageValue
        averageValue: {{ .Values.hpa.targetAverageValue | quote }}
{{- end }}
