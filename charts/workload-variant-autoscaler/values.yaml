# Controller deployment settings
# Set controller.enabled=false to deploy only VA/HPA/ServiceMonitor resources
# without deploying another controller instance (use existing cluster-wide controller)
controller:
  enabled: true

wva:
  enabled: true

  image:
    repository: ghcr.io/llm-d/llm-d-workload-variant-autoscaler
    tag: v0.5.1
  imagePullPolicy: Always

  metrics:
    enabled: true
    port: 8443
    secure: true
  
  # If true, the controller will only watch the namespace it is deployed in.
  # If false, the controller will watch all namespaces (cluster-scoped).
  namespaceScoped: true

  reconcileInterval: 60s

  # ConfigMap settings
  configMap:
    # If true, makes the ConfigMap immutable (cannot be updated after creation).
    # This provides security benefits by preventing accidental or malicious changes
    # to configuration, but disables runtime config updates (dynamic config changes
    # will require recreating the ConfigMap and restarting the controller).
    # Default: false (allows runtime updates for dynamic configuration)
    immutable: false
    
  prometheus:
    monitoringNamespace: openshift-user-workload-monitoring
    serviceAccountName: "kube-prometheus-stack-prometheus"
    baseURL: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
    # Development security configuration (relaxed for easier development)
    tls:
      insecureSkipVerify: true   # Development: true, Production: false
      caCertPath: "/etc/ssl/certs/prometheus-ca.crt"
    # caCert: |  # Uncomment and provide your CA certificate
    #   -----BEGIN CERTIFICATE-----
    #   YOUR_CA_CERTIFICATE_HERE
    #   -----END CERTIFICATE-----

  limitedMode: false  # Enable limited mode (default: false)
  # Node selector for sharding WVA instances
  # Example: "wva.llmd.ai/shard=instance-a"
  nodeSelector: ""
  scaleToZero: false  # Enable scaling variants to zero replicas (default: false)
  # Controller instance identifier for multi-controller isolation
  # When set, adds controller_instance label to all emitted metrics
  # Used with HPA selector to filter metrics from specific controller instances
  # Useful for parallel e2e tests where multiple WVA controllers run simultaneously
  controllerInstance: ""

  # InferencePool API group to watch. Must match the API group used by InferencePools in the cluster.
  # - inference.networking.x-k8s.io (default): v1alpha2 / x-k8s.io
  # - inference.networking.k8s.io: v1 (used by GIE helm charts such as gaie-sim on kind-emulator)
  # When empty, WVA defaults to inference.networking.x-k8s.io.
  poolGroup: ""

  # Saturation-based scaling configuration
  # These thresholds determine when replicas are saturated and when to scale up
  capacityScaling:
    # Global defaults applied to all variants unless overridden
    default:
      kvCacheThreshold: 0.80      # Replica saturated if KV cache utilization >= threshold (0.0-1.0)
      queueLengthThreshold: 5     # Replica saturated if queue length >= threshold
      kvSpareTrigger: 0.1         # Scale-up if avg spare KV capacity < trigger (0.0-1.0)
      queueSpareTrigger: 3        # Scale-up if avg spare queue capacity < trigger
    
    # Per-model/namespace overrides (optional)
    # Example:
    # overrides:
    #   llm-d:
    #     modelID: "Qwen/Qwen3-0.6B"
    #     namespace: "llm-d-autoscaler"
    #     kvCacheThreshold: 0.70
    #     kvSpareTrigger: 0.35
    overrides: {}

llmd:
  namespace: llm-d-autoscaler
  modelName: ms-workload-autoscaler-llm-d-modelservice
  modelID: "Qwen/Qwen3-0.6B"

va:
  enabled: true
  # accelerator: Optional. If not specified, it will be auto-discovered
  # from target deployment. If specified, it will be used as fall-back value if it can't 
  # be discovered.
  accelerator: H100
  # Cost per replica in arbitrary units (higher = more expensive to scale)
  # Used by saturation analysis to weight scaling decisions across variants
  # Example: H100=10.0, A100=8.0, L40S=5.0 (relative GPU costs)
  variantCost: "10.0"
  sloTpot: 10
  sloTtft: 1000

# ───────────────────────────────────────────────────────────────────────────
# Autoscaling sub-resource ownership
#
# WVA emits wva_desired_replicas metrics that external autoscalers consume.
# By default WVA also creates an HPA that reads those metrics. If an external
# platform (e.g. KServe) already owns the HPA or ScaledObject for the same
# target Deployment, set hpa.enabled=false (and keda.enabled=false) to
# prevent conflicting controllers competing over the same scaling objects.
#
# Migration path:
#   Phase 1 (today/KServe): hpa.enabled=false, keda.enabled=false
#     → external platform owns HPA/ScaledObject; WVA only emits metrics.
#   Phase 2 (future): hpa.enabled=true OR keda.enabled=true
#     → WVA owns autoscaling sub-resources end-to-end.
# ───────────────────────────────────────────────────────────────────────────
hpa:
  # Set to false when an external controller (e.g. KServe) owns the HPA
  # for the target Deployment. Only one controller should own the HPA at a time.
  enabled: true
  # minReplicas: 0 enables scale-to-zero (requires HPAScaleToZero feature gate in k8s)
  # minReplicas: 1 is the safe default that prevents scale-to-zero
  # Set to 0 when wva.scaleToZero is enabled
  minReplicas: 1
  maxReplicas: 2
  targetAverageValue: "1"
  # HPA scaling behavior configuration
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 240
      selectPolicy: Max
      policies:
        - type: Pods
          value: 10
          periodSeconds: 150
    scaleDown:
      stabilizationWindowSeconds: 240
      selectPolicy: Max
      policies:
        - type: Pods
          value: 10
          periodSeconds: 150

# KEDA ScaledObject — alternative to the built-in HPA above.
# Enable this when you want WVA to manage a KEDA ScaledObject instead of
# (or in addition to) a plain HPA. Requires KEDA to be installed in the cluster.
# Do NOT enable both hpa.enabled and keda.enabled for the same target Deployment —
# that would create two competing autoscalers.
# Set both to false to let an external platform (e.g. KServe) own all
# autoscaling sub-resources.
keda:
  # Set to true to let WVA deploy a KEDA ScaledObject for the target Deployment.
  # Ensure hpa.enabled=false when this is enabled to avoid dual-controller conflicts.
  enabled: false

  # Minimum replica count (0 = scale-to-zero, KEDA's native support).
  minReplicaCount: 0
  maxReplicaCount: 10

  # How often KEDA polls metrics (seconds).
  pollingInterval: 15
  # Idle time before scaling to zero (seconds).
  cooldownPeriod: 30

  # Prometheus trigger — must point to the same Prometheus instance
  # that WVA emits wva_desired_replicas metrics to.
  # Example: https://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  prometheusServerAddress: ""

  # Scaling threshold: replica count target per metric value.
  threshold: "1"
  # Scale out from zero only when metric exceeds this value.
  activationThreshold: "0"
  # Set to "true" to skip TLS verification (development only).
  unsafeSsl: "false"

  # Optional: advanced HPA behavior config injected into the KEDA-managed HPA.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 10
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 10
          periodSeconds: 30

vllmService:
  enabled: true
  port: 8200
  targetPort: 8200
  nodePort: 30000
  interval: 15s
  scheme: http  # vLLM emulator runs on HTTP
